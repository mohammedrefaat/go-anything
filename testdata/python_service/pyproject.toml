[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-service"
version = "0.2.0"
description = "Sample Python CLI and FastAPI HTTP service fixture for go-anything dogfooding"
authors = [{ name = "go-anything maintainers" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",
]

[project.scripts]
python-service = "cli:main"

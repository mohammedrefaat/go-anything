# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser configuration for go-anything
# Reference: https://goreleaser.com
version: 2

project_name: go-anything

before:
  hooks:
    - go mod tidy

builds:
  - id: go-anything
    binary: go-anything
    main: ./cmd/go-anything
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE*
      - NOTICE*
      - README*
      - SECURITY*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

signs:
  - id: cosign-all
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: all

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  mode: replace

brews:
  - name: go-anything
    repository:
      owner: mohammedrefaat
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/mohammedrefaat/go-anything"
    description: "Strangler-fig migration engine to Go with behavioral evidence verification"
    license: "Apache-2.0"
    test: |
      system "#{bin}/go-anything version"

scoops:
  - name: go-anything
    repository:
      owner: mohammedrefaat
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: "https://github.com/mohammedrefaat/go-anything"
    description: "Strangler-fig migration engine to Go with behavioral evidence verification"
    license: "Apache-2.0"
